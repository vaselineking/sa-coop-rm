# Builds SA:COOP on every push and pull request and keeps both archives as artifacts: the full one (SA-COOP.zip) and the
# light one without the skin packs and the skins' voices (SA-COOP-Lite.zip).
# A tag like v0.4.0 also publishes them as one GitHub release, "SA:COOP v0.4.0", with both archives attached and the text
# of .github/release-notes.md. The same from the site with no tag pushed: Actions -> build -> Run workflow, a version typed
# in (v0.4.0); the workflow puts the tag on the chosen branch's commit itself.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например v0.4.0 (пусто: только собрать)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the compiler
        uses: actions/cache@v4
        with:
          path: toolchain/llvm-mingw
          key: llvm-mingw-20261006-ucrt-x86_64

      - name: Get the compiler
        shell: pwsh
        run: ./tools/get-toolchain.ps1

      - name: Check the layers (Feature-Sliced Design)
        run: python tools/fsd_check.py

      - name: Check that every text of the game has its English one
        run: python tools/i18n_check.py
        env:
          PYTHONIOENCODING: utf-8  # it prints the Russian texts it finds

      - name: Build both archives
        run: python tools/build.py dist lite

      - uses: actions/upload-artifact@v4
        with:
          name: SA-COOP
          path: dist/SA-COOP.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SA-COOP-Lite
          path: dist/SA-COOP-Lite.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true  # the SA-COOP and SA-COOP-Lite artifacts: both zips side by side in dist/

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: SA:COOP ${{ env.VERSION }}
          files: |
            dist/SA-COOP.zip
            dist/SA-COOP-Lite.zip
          fail_on_unmatched_files: true
          body_path: .github/release-notes.md
